name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Lint
        # continue-on-error: the repo carries pre-existing lint debt
        # (unused vars, uninstalled plugin rules). Keep lint visible but
        # non-blocking until the codebase is clean; re-enable strict mode
        # once `npm run lint` passes locally.
        continue-on-error: true
        run: npm run lint
      - name: Tests
        # --passWithNoTests keeps CI green until a real test suite lands
        run: npm test -- --passWithNoTests
      - name: Build
        run: npm run build
